<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync-AI | Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #102a43 0%, #000000 100%);
            --accent-blue: #00d2ff;
            --accent-purple: #9d50bb;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            min-height: 100vh; /* Fixed typo from '100 vh' */
            display: flex;
            align-items: center;
            justify-content: center;
            /* overflow: hidden; Removed to allow scrolling if error message is too long on small screens */
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin: 20px 0; /* Add margin for scrolling safety */
        }

        /* Branding */
        .brand-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .logo-sq {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), #3a7bd5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .icon-box {
            font-size: 55px;
            margin-bottom: 15px;
            line-height: 1;
            /* Adding a subtle drop shadow to emoji */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); 
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        p {
            color: #a0aec0;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Dynamic Error Box */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 30px;
            word-wrap: break-word; /* Prevents long text from breaking the UI */
            overflow-wrap: break-word;
            white-space: pre-wrap;
            text-align: left; /* Looks better for actual code errors */
        }

        /* Buttons */
        .btn-back {
            display: inline-block;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.25);
            cursor: pointer;
            border: none;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 210, 255, 0.4);
        }

        /* ── Responsive Design for Mobile Devices ── */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .brand-text {
                font-size: 1.2rem;
                margin-bottom: 25px;
            }
            .logo-sq {
                width: 28px;
                height: 28px;
                font-size: 0.9rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            p {
                font-size: 0.95rem;
            }
            .error-msg {
                font-size: 0.8rem;
                padding: 12px;
            }
            .btn-back {
                padding: 12px 24px;
                font-size: 0.95rem;
                width: 100%; /* Makes button full width on tiny screens */
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-text">
            <div class="logo-sq">S</div>
            <span>SkillSync-AI</span>
        </div>

        <div class="icon-box">⚠️</div>
        
        <h1>Something went wrong</h1>
        
        <div class="error-msg">
            {{ error|default:"500: Internal Server Error. The AI service encountered a temporary issue. Please try again." }}
        </div>

        <p>Our AI encountered an unexpected hiccup while processing your request.</p>

        <a href="{% url 'skill_advisor' %}" class="btn-back">
            Go back to Roadmap 🚀
        </a>
    </div>

</body>
</html>
