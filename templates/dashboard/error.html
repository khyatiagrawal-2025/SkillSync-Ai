<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync-AI | Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #102a43 0%, #000000 100%);
            --accent-blue: #00d2ff;
            --accent-purple: #9d50bb;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            height: 100 vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .icon-box {
            font-size: 50px;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p {
            color: #a0aec0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .error-msg {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.2);
            color: #ff8a8a;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-block;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 210, 255, 0.4);
        }

        /* Branding match from your photo */
        .brand-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
            font-weight: 800;
            font-size: 1.5rem;
        }

        .logo-sq {
            width: 32px;
            height: 32px;
            background: #00d2ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="brand-text">
            <div class="logo-sq">S</div>
            <span>SkillSync-AI</span>
        </div>

        <div class="icon-box">⚠️</div>
        
        <h1>Something went wrong</h1>
        
        <div class="error-msg">
            {{ error }}
        </div>

        <p>Our AI encountered an unexpected hiccup while processing your request.</p>

        <a href="{% url 'skill_advisor' %}" class="btn-back">
            Go back to Roadmap 🚀
        </a>
    </div>

</body>
</html>
